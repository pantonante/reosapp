<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Re:OS · Field Reader</title>
  <link rel="stylesheet" href="/assets/pdf_viewer.css">
  <style>
    :root { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #272923; background: #eeeae1; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #b75d3f; outline-offset: 2px; }
    [hidden] { display: none !important; }
    .shell { height: 100dvh; }
    .sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(350px, 88vw); display: flex; flex-direction: column; background: #e7e2d7; box-shadow: 18px 0 45px #27292330; transform: translateX(-110%); transition: transform .2s ease; }
    body.nav-open .sidebar { transform: translateX(0); }
    .backdrop { display: none; position: fixed; z-index: 20; inset: 0; width: 100%; border: 0; background: #27292375; }
    body.nav-open .backdrop { display: block; }
    .brand { display: flex; align-items: center; justify-content: space-between; padding: max(22px, env(safe-area-inset-top)) 20px 17px; border-bottom: 1px solid #d2cbbd; }
    .brand-mark { font: normal 27px Georgia, "Times New Roman", serif; letter-spacing: -.08em; }
    .brand-mark span { color: #ad5739; }
    .brand small { margin-left: 12px; color: #77776e; font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    .icon-btn { display: inline-flex; align-items: center; justify-content: center; flex: none; min-width: 42px; height: 42px; border: 1px solid #cfc7b8; border-radius: 5px; background: #fffdf8; color: #34352d; font-size: 20px; }
    .icon-btn:hover, .small-btn:hover { border-color: #ad5739; }
    .nav-scroll { flex: 1; min-height: 0; overflow: auto; padding: 10px 10px 34px; }
    .section-label { display: flex; justify-content: space-between; padding: 18px 12px 8px; color: #77776e; font-size: 10px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .nav-item { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 9px; padding: 10px 12px; border: 0; border-radius: 5px; background: transparent; color: #35372f; text-align: left; font-size: 13px; }
    .nav-item:hover { background: #dcd5c9; }
    .nav-item.active { color: #7e3e2a; background: #f8f5ee; box-shadow: inset 3px 0 #ad5739; }
    .nav-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item .count, .nav-item .marker { flex: none; color: #969286; font-size: 11px; font-variant-numeric: tabular-nums; }
    .nav-item.desktop-open .marker { display: inline-flex; align-items: center; gap: 4px; color: #9b5136; font-weight: 700; }
    .nav-item.desktop-open .marker::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #b56242; }
    .nav-item.desktop-current .marker { color: #254c3b; }
    .nav-item.desktop-current .marker::before { background: #3e775a; }
    .nav-empty { padding: 10px 12px; color: #77776e; font-size: 12px; line-height: 1.5; }
    .main { display: flex; flex-direction: column; width: 100%; height: 100dvh; min-width: 0; }
    .topbar { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 9px max(18px, env(safe-area-inset-right)) 9px max(18px, env(safe-area-inset-left)); border-bottom: 1px solid #d8d1c4; background: #f7f4ed; }
    .title-stack { min-width: 0; flex: 1; }
    .eyebrow { font-size: 10px; color: #9d6049; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .top-title { font: 19px Georgia, "Times New Roman", serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search { width: clamp(200px, 28vw, 390px); height: 43px; padding: 0 14px; border: 1px solid #cfc7b8; border-radius: 5px; background: #fffdf8; color: #272923; font-size: 14px; }
    .small-btn { min-height: 42px; padding: 0 13px; border: 1px solid #cfc7b8; border-radius: 5px; background: #fffdf8; color: #34352d; font-size: 12px; font-weight: 700; }
    .content { flex: 1; min-height: 0; overflow: auto; }
    .inner { max-width: 980px; margin: 0 auto; padding: 44px clamp(24px, 5vw, 76px) 90px; }
    .hero-kicker { color: #9d6049; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { max-width: 820px; margin: 13px 0 16px; font: normal clamp(34px, 4.4vw, 58px)/1.06 Georgia, "Times New Roman", serif; letter-spacing: -.04em; }
    .description { max-width: 760px; color: #6c6e65; font: 17px/1.55 Georgia, "Times New Roman", serif; }
    .rule { height: 1px; margin: 32px 0 18px; background: #d5cec0; }
    .paper-row { display: flex; align-items: center; gap: 20px; min-height: 75px; width: 100%; padding: 14px 0; border: 0; border-bottom: 1px solid #d8d1c4; background: transparent; color: inherit; text-align: left; }
    .paper-row:hover .paper-title { color: #a64f34; }
    .paper-row .paper-copy { min-width: 0; flex: 1; }
    .paper-title { display: block; font: 19px/1.25 Georgia, "Times New Roman", serif; }
    .paper-meta { display: block; margin-top: 5px; color: #7e7f76; font-size: 12px; }
    .paper-row .open-badge { color: #9b5136; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .arrow { font-size: 22px; color: #b15b3c; }
    .tabs { display: flex; gap: 2px; padding: 0 max(18px, env(safe-area-inset-left)); border-bottom: 1px solid #d8d1c4; background: #f7f4ed; }
    .tab { position: relative; min-height: 49px; padding: 0 16px; border: 0; background: transparent; color: #73756d; font-size: 13px; font-weight: 700; }
    .tab.active { color: #8c432c; }
    .tab.active::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: -1px; height: 2px; background: #ad5739; }
    .paper-body { flex: 1; min-height: 0; overflow: auto; }
    .paper-body.pdf { overflow: hidden; }
    .document { max-width: 830px; margin: 0 auto; padding: 36px clamp(24px, 5vw, 70px) 90px; }
    .document pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: #383a32; font: 16px/1.7 Georgia, "Times New Roman", serif; }
    .notes-editor { display: block; width: 100%; min-height: 55vh; padding: 22px; border: 1px solid #cfc7b8; border-radius: 5px; resize: vertical; background: #fffdf8; color: #34362e; font: 15px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .save-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .status { color: #77776e; font-size: 12px; }
    .primary-btn { min-height: 44px; padding: 0 20px; border: 0; border-radius: 5px; background: #a75236; color: white; font-size: 13px; font-weight: 700; }
    .primary-btn:disabled { opacity: .5; }
    .empty { padding: 48px 0; color: #77776e; font: 18px/1.5 Georgia, "Times New Roman", serif; }
    .pdf-shell { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; }
    .pdf-toolbar { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; min-height: 58px; padding: 8px 12px; border-bottom: 1px solid #cfc7b8; background: #e7e2d7; }
    .pdf-toolbar .spacer { flex: 1; }
    .pdf-toolbar .page-input { width: 57px; height: 40px; border: 1px solid #cfc7b8; border-radius: 5px; background: #fffdf8; text-align: center; font-size: 13px; }
    .pdf-toolbar .page-total { color: #686a61; font-size: 12px; white-space: nowrap; }
    .pdf-stage { position: relative; flex: 1; min-height: 0; background: #aaa79e; }
    .pdf-scroll { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
    .pdfViewer { --scale-factor: 1; --page-margin: 18px auto; --page-border: 1px solid #77766f; --pdfViewer-padding-bottom: 18px; }
    .pdfViewer .page { box-shadow: 0 3px 16px #28282036; }
    .pdfViewer .page.loadingIcon::after { background: none; }
    .pdf-message { position: absolute; z-index: 2; top: 18px; left: 50%; transform: translateX(-50%); max-width: min(90%, 560px); padding: 12px 16px; border-radius: 5px; background: #fffdf8; color: #34362e; box-shadow: 0 3px 20px #28282028; font-size: 13px; text-align: center; }
    .pdf-message.error { color: #8c432c; }
    @media (max-width: 730px) {
      .topbar { flex-wrap: wrap; gap: 8px; }
      .title-stack { flex: 1; }
      .search { order: 3; width: 100%; }
      .inner { padding-top: 32px; }
      .pdf-toolbar { justify-content: flex-start; }
      .pdf-toolbar .small-btn { padding: 0 9px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Library navigation" aria-hidden="true" inert>
      <div class="brand"><div><span class="brand-mark"><span>Re:</span>OS</span><small>Field Reader</small></div><button class="icon-btn" id="close-nav" aria-label="Close navigation">×</button></div>
      <nav id="navigation" class="nav-scroll"></nav>
    </aside>
    <button class="backdrop" id="backdrop" aria-label="Close navigation"></button>
    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn" id="menu" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="title-stack"><div class="eyebrow" id="top-eyebrow">Your library</div><div class="top-title" id="top-title">Reading desk</div></div>
        <input id="search" class="search" type="search" placeholder="Search any paper" aria-label="Search papers">
        <button id="refresh" class="small-btn">Refresh</button>
      </header>
      <div id="tabs" class="tabs" hidden></div>
      <div id="content" class="content"></div>
    </main>
  </div>
  <script type="module" src="/assets/reader.mjs"></script>
</body>
</html>

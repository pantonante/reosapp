[package]
name = "reos-standalone"
version = "0.1.0"
description = "Re:OS — personal research operating system (desktop)"
authors = ["Pasquale Antonante"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "reos_standalone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
# default-features off to drop rustls: bioRxiv's Cloudflare fingerprints the
# rustls TLS handshake and answers 429; the OS-native TLS stack passes.
tauri-plugin-http = { version = "2", default-features = false, features = [
	"native-tls",
	"http2",
	"charset",
	"macos-system-configuration",
	"cookies",
] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
dirs = "5"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSSharingService"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
